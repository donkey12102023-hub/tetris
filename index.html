<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris Infinito</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #151c33;
      --border: #2b3558;
      --text: #f4f7ff;
      --muted: #aab4d0;
      --accent: #7c5cff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #1a2140, var(--bg) 55%);
      color: var(--text);
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .game {
      display: grid;
      grid-template-columns: auto 190px;
      gap: 20px;
      align-items: start;
    }

    canvas {
      display: block;
      background: #080c18;
      border: 3px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .side {
      background: rgba(21, 28, 51, .94);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 24px;
    }

    .stat {
      margin: 14px 0;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .stat strong {
      font-size: 22px;
    }

    #next {
      width: 120px;
      height: 120px;
      margin: 8px auto 18px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #080c18;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 11px;
      background: var(--accent);
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover { filter: brightness(1.1); }

    .controls {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .mobile-controls {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .mobile-controls button {
      margin: 0;
      font-size: 18px;
      padding: 13px 5px;
    }

    .mobile-controls .wide {
      grid-column: span 3;
    }

    @media (max-width: 650px) {
      .game {
        grid-template-columns: 1fr;
        justify-items: center;
      }

      .side {
        width: min(300px, 100%);
      }

      .mobile-controls {
        display: grid;
      }

      canvas {
        width: min(90vw, 300px);
        height: auto;
      }
    }
  </style>
</head>
<body>
  <main class="game">
    <canvas id="board" width="300" height="600"></canvas>

    <aside class="side">
      <h1>Tetris Infinito</h1>

      <div class="stat">
        <span>Pontuação</span>
        <strong id="score">0</strong>
      </div>

      <div class="stat">
        <span>Linhas</span>
        <strong id="lines">0</strong>
      </div>

      <div class="stat">
        <span>Nível</span>
        <strong id="level">1</strong>
      </div>

      <div class="stat">
        <span>Próxima peça</span>
      </div>

      <canvas id="next" width="120" height="120"></canvas>

      <button id="restart">Reiniciar</button>

      <div class="controls">
        <strong>Teclado</strong><br>
        ← → mover<br>
        ↓ acelerar<br>
        ↑ girar<br>
        Espaço: queda instantânea<br>
        P: pausar
      </div>

      <div class="mobile-controls">
        <button data-action="left">←</button>
        <button data-action="rotate">↻</button>
        <button data-action="right">→</button>
        <button data-action="down">↓</button>
        <button class="wide" data-action="drop">QUEDA INSTANTÂNEA</button>
      </div>
    </aside>
  </main>

  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const nextCanvas = document.getElementById("next");
    const nextCtx = nextCanvas.getContext("2d");

    const COLS = 10;
    const ROWS = 20;
    const BLOCK = 30;

    const COLORS = [
      null,
      "#00e5ff", // I
      "#2962ff", // J
      "#ff8f00", // L
      "#ffe600", // O
      "#00d26a", // S
      "#b000ff", // T
      "#ff1744"  // Z
    ];

    const SHAPES = [
      [[1,1,1,1]],
      [[2,0,0],[2,2,2]],
      [[0,0,3],[3,3,3]],
      [[4,4],[4,4]],
      [[0,5,5],[5,5,0]],
      [[0,6,0],[6,6,6]],
      [[7,7,0],[0,7,7]]
    ];

    let board;
    let player;
    let nextPiece;
    let score;
    let lines;
    let level;
    let dropInterval;
    let lastTime;
    let dropCounter;
    let gameOver;
    let paused;

    function createBoard() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    }

    function randomPiece() {
      const index = Math.floor(Math.random() * SHAPES.length);
      const shape = SHAPES[index].map(row => [...row]);
      return {
        matrix: shape,
        x: Math.floor(COLS / 2) - Math.ceil(shape[0].length / 2),
        y: 0
      };
    }

    function resetGame() {
      board = createBoard();
      player = randomPiece();
      nextPiece = randomPiece();
      score = 0;
      lines = 0;
      level = 1;
      dropInterval = 800;
      dropCounter = 0;
      lastTime = 0;
      gameOver = false;
      paused = false;
      updateUI();
      drawNext();
    }

    function collide(board, piece) {
      const m = piece.matrix;
      const o = { x: piece.x, y: piece.y };

      for (let y = 0; y < m.length; y++) {
        for (let x = 0; x < m[y].length; x++) {
          if (
            m[y][x] !== 0 &&
            (board[y + o.y] === undefined ||
             board[y + o.y][x + o.x] === undefined ||
             board[y + o.y][x + o.x] !== 0)
          ) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(board, piece) {
      piece.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            board[y + piece.y][x + piece.x] = value;
          }
        });
      });
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < y; x++) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }

      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    function playerRotate() {
      if (paused || gameOver) return;

      const originalX = player.x;
      const originalMatrix = player.matrix.map(row => [...row]);

      rotate(player.matrix, 1);

      let offset = 1;
      while (collide(board, player)) {
        player.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));

        if (offset > player.matrix[0].length) {
          player.matrix = originalMatrix;
          player.x = originalX;
          return;
        }
      }
    }

    function playerMove(dir) {
      if (paused || gameOver) return;
      player.x += dir;
      if (collide(board, player)) player.x -= dir;
    }

    function playerDrop() {
      if (paused || gameOver) return;

      player.y++;

      if (collide(board, player)) {
        player.y--;
        merge(board, player);
        clearLines();
        spawnNext();
      }

      dropCounter = 0;
    }

    function hardDrop() {
      if (paused || gameOver) return;

      let distance = 0;
      while (!collide(board, { ...player, y: player.y + 1 })) {
        player.y++;
        distance++;
      }

      score += distance * 2;
      playerDrop();
      updateUI();
    }

    function spawnNext() {
      player = nextPiece;
      nextPiece = randomPiece();

      if (collide(board, player)) {
        gameOver = true;
      }

      drawNext();
      updateUI();
    }

    function clearLines() {
      let cleared = 0;

      outer:
      for (let y = ROWS - 1; y >= 0; y--) {
        for (let x = 0; x < COLS; x++) {
          if (board[y][x] === 0) continue outer;
        }

        board.splice(y, 1);
        board.unshift(Array(COLS).fill(0));
        y++;
        cleared++;
      }

      if (cleared > 0) {
        const points = [0, 100, 300, 500, 800];
        score += points[cleared] * level;
        lines += cleared;
        level = Math.floor(lines / 10) + 1;
        dropInterval = Math.max(100, 800 - (level - 1) * 60);
      }
    }

    function drawCell(context, x, y, value, size) {
      context.fillStyle = COLORS[value];
      context.fillRect(x * size, y * size, size, size);

      context.strokeStyle = "rgba(255,255,255,.18)";
      context.lineWidth = 1;
      context.strokeRect(x * size, y * size, size, size);

      context.fillStyle = "rgba(255,255,255,.18)";
      context.fillRect(x * size + 3, y * size + 3, size - 6, 4);
    }

    function drawMatrix(context, matrix, offset, size) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            drawCell(context, x + offset.x, y + offset.y, value, size);
          }
        });
      });
    }

    function draw() {
      ctx.fillStyle = "#080c18";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (board[y][x]) drawCell(ctx, x, y, board[y][x], BLOCK);
        }
      }

      drawMatrix(ctx, player.matrix, { x: player.x, y: player.y }, BLOCK);

      if (paused || gameOver) {
        ctx.fillStyle = "rgba(0,0,0,.68)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.textAlign = "center";
        ctx.fillStyle = "#fff";
        ctx.font = "bold 28px Arial";
        ctx.fillText(gameOver ? "FIM DE JOGO" : "PAUSADO", canvas.width / 2, canvas.height / 2 - 10);

        ctx.font = "16px Arial";
        ctx.fillText(
          gameOver ? "Clique em Reiniciar" : "Pressione P para continuar",
          canvas.width / 2,
          canvas.height / 2 + 25
        );
      }
    }

    function drawNext() {
      nextCtx.fillStyle = "#080c18";
      nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

      const matrix = nextPiece.matrix;
      const size = 24;
      const width = matrix[0].length * size;
      const height = matrix.length * size;

      drawMatrix(
        nextCtx,
        matrix,
        {
          x: Math.floor((nextCanvas.width - width) / 2 / size),
          y: Math.floor((nextCanvas.height - height) / 2 / size)
        },
        size
      );
    }

    function updateUI() {
      document.getElementById("score").textContent = score;
      document.getElementById("lines").textContent = lines;
      document.getElementById("level").textContent = level;
    }

    function update(time = 0) {
      const delta = time - lastTime;
      lastTime = time;

      if (!paused && !gameOver) {
        dropCounter += delta;

        if (dropCounter > dropInterval) {
          playerDrop();
        }
      }

      draw();
      requestAnimationFrame(update);
    }

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        playerMove(-1);
      } else if (event.key === "ArrowRight") {
        event.preventDefault();
        playerMove(1);
      } else if (event.key === "ArrowDown") {
        event.preventDefault();
        playerDrop();
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        playerRotate();
      } else if (event.code === "Space") {
        event.preventDefault();
        hardDrop();
      } else if (event.key.toLowerCase() === "p") {
        if (!gameOver) paused = !paused;
      }
    });

    document.getElementById("restart").addEventListener("click", resetGame);

    document.querySelectorAll("[data-action]").forEach(button => {
      button.addEventListener("click", () => {
        const action = button.dataset.action;

        if (action === "left") playerMove(-1);
        if (action === "right") playerMove(1);
        if (action === "down") playerDrop();
        if (action === "rotate") playerRotate();
        if (action === "drop") hardDrop();
      });
    });

    resetGame();
    update();
  </script>
</body>
</html>
